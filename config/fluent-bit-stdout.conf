[SERVICE]
    Parsers_File /home/tiya2/fluent-bit-plugin/parsers.conf
    Flush        1
    Log_Level    info

[INPUT]
    Name            tail
    Path            /home/tiya2/fluent-bit-plugin/logs.txt
    Tag             mylogs
    Parser          custom_parser
    Read_from_Head  true
    Path_Key        source_file

[INPUT]
    Name            tail
    Path            /home/tiya2/fluent-bit-plugin/json_logs.txt
    Tag             jsonlogs
    Parser          json_parser
    Read_from_Head  true
    Path_Key        source_file

[FILTER]
    Name   grep
    Match  *
    Regex  level (INFO|WARNING|ERROR|CRITICAL)

[FILTER]
    Name         count_filter
    Match_Regex  ^(mylogs|jsonlogs)$
    output_key   count


[FILTER]
    Name          rewrite_tag
    Match_Regex   ^(mylogs|jsonlogs)$
    Rule          $message  %%[^%]+%%  special_alert  false
    Emitter_Name  special_alert_emitter

[OUTPUT]
    Name   stdout
    Match_Regex  ^(mylogs|jsonlogs)$
    Format json_lines


[OUTPUT]
    Name   stdout
    Match  special_alert
    Format json_lines
