[SERVICE]
    Parsers_File /home/tiya2/fluent-bit-plugin/parsers.conf
    Flush        1
    Log_Level    info

[INPUT]
    Name            tail
    Path            /home/tiya2/fluent-bit-plugin/logs.txt
    Tag             mylogs
    Parser          custom_parser
    Read_from_Head  true
    Path_Key        source_file

[INPUT]
    Name            tail
    Path            /home/tiya2/fluent-bit-plugin/json_logs.txt
    Tag             jsonlogs
    Parser          json_parser
    Read_from_Head  true
    Path_Key        source_file

# Tail any *.log file in the plugin directory.  Files whose names contain an
# integer segment (e.g. sample_log_25_21062026.log) will have that integer
# injected as strat_id by the stratid_filter below.
# Adjust Path to the directory / glob where your ID-bearing log files live.
[INPUT]
    Name            tail
    Path            /home/tiya2/fluent-bit-plugin/*.log
    Tag             stratidlogs
    Parser          custom_parser
    Read_from_Head  true
    Path_Key        source_file

[FILTER]
    Name   grep
    Match  *
    Regex  level (INFO|WARNING|ERROR|CRITICAL)

# Extract strat_id from the log filename for ID-bearing files.
# filename_regex: POSIX extended regex — first capture group must be the int.
# Default _([0-9]+)_ matches:
#   sample_log_25_21062026.log  → strat_id = 25
#   other_id_34_log_2106.log    → strat_id = 34
# Override filename_regex here if your naming convention differs.
[FILTER]
    Name           stratid_filter
    Match          stratidlogs
    source_key     source_file
    filename_regex _([0-9]+)_
    target_key     strat_id

[FILTER]
    Name         count_filter
    Match_Regex  ^(mylogs|jsonlogs|stratidlogs)$
    output_key   count

[FILTER]
    Name          rewrite_tag
    Match_Regex   ^(mylogs|jsonlogs|stratidlogs)$
    Rule          $message  %%[^%]+%%  special_alert  false
    Emitter_Name  special_alert_emitter

[OUTPUT]
    Name              batch_http
    Match_Regex       ^(mylogs|jsonlogs|stratidlogs)$
    host              127.0.0.1
    port              8080
    path              /portfolio_log_analyzer/query-handle_portfolio_alerts
    batch_size        200
    batch_timeout_sec 2
    collapse_alerts   true
    retry_limit       3
    retry_delay_sec   1


[OUTPUT]
    Name              batch_http
    Match             special_alert
    host              127.0.0.1
    port              8081
    path              /portfolio_log_analyzer/query-handle_special_alerts
    batch_size        200
    batch_timeout_sec 2
    collapse_alerts   true
    retry_limit       3
    retry_delay_sec   1
